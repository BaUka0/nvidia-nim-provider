name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Lint
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint
      - name: Compile
        run: npm run compile
      - name: Test Suite
        run: npm test -- --runInBand
      - name: Package VSIX
        run: npm run package:vsix
      - name: Strict Type Check
        run: npm exec -- tsc --noEmit
