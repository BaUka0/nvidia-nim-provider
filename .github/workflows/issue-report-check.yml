name: Bug Report File Check

# Bug reports submitted through the issue form must attach the turn report as a file.
# Pasted JSON is truncated, hard to read, and loses the surrounding session data.
# Titles that are a pasted error message are rewritten from the attached report.
# The logic lives in .github/scripts/issue-report-check.js (tested in tests/issue-report-check.test.ts).

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    # Comments only matter when the issue author attaches the report there.
    if: >-
      github.event.issue.pull_request == null &&
      !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association) &&
      (github.event_name == 'issues' || github.event.comment.user.login == github.event.issue.user.login)
    steps:
      - uses: actions/checkout@v7
        with:
          # The catalog supplies model display names for issue titles.
          sparse-checkout: |
            .github/scripts/
            src/models/catalog.ts
          sparse-checkout-cone-mode: false
      - name: Require Attached Turn Report
        uses: actions/github-script@v8
        with:
          script: |
            const { run } = require('./.github/scripts/issue-report-check.js');
            await run({ github, context, core });
