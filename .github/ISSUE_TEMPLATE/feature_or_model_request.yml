name: Feature or Model Request
description: Propose a new NVIDIA NIM model, setting, or enhancement.
title: "[Request]: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: request-type
    attributes:
      label: Request Type
      description: Category of request.
      options:
        - "New NVIDIA NIM Model"
        - "Configuration Setting"
        - "Tool or Agentic Workflow"
        - "Documentation or Other"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What should be added or changed, and what problem does it solve?
      placeholder: Detailed description...
    validations:
      required: true

  - type: textarea
    id: model-details
    attributes:
      label: Model Details (if requesting a model)
      description: |
        If requesting a model, specify:
        * Upstream model ID from build.nvidia.com/models
        * Context window and maximum output tokens
        * Capabilities (tool calling, vision, reasoning)
      placeholder: Model identifier and specs...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Relevant references or pull requests.
      placeholder: Optional references...
    validations:
      required: false
