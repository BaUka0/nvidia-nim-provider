name: Bug Report
description: Report an error, connection failure, model stall, or repetition loop in NVIDIA NIM Agent.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What happened, and what did you expect instead?
      placeholder: Describe what went wrong...
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Active Model
      description: Which model was selected when the issue occurred?
      options:
        - "z-ai/glm-5.3-flash"
        - "deepseek-ai/deepseek-v4.1-flash"
        - "stepfun-ai/step-5-preview"
        - "minimaxai/minimax-m3.1-flash"
        - "nvidia/nemotron-3-ultra-550b-a55b"
        - "nvidia/nemotron-3.5-lightning-30b-a3b"
        - "nvidia/nemotron-3.5-super-vl-120b-a12b"
        - "meta/muse-glimmer-30b"
        - "Other / Not sure / General issue"
    validations:
      required: false

  - type: dropdown
    id: reasoning-mode
    attributes:
      label: Reasoning Mode (optional)
      description: Reasoning effort level, if applicable.
      options:
        - "Default / Unchanged"
        - "Disabled (None)"
        - "Low"
        - "Medium"
        - "High"
        - "Max"
    validations:
      required: false

  - type: textarea
    id: last-turn-report
    attributes:
      label: Last Turn Report
      description: |
        Run Command Palette (`Ctrl+Shift+P` / `Cmd+Shift+P`) → `NVIDIA NIM: Save Last Turn Report` right after the failing turn, then drag and drop the saved `nvidia-nim-turn-report-*.json` file into this box.
        Required: attach the file itself. Pasted JSON is not accepted, and issues without an attached report file are closed automatically until one is added. API keys are automatically redacted.
      placeholder: Drag and drop the nvidia-nim-turn-report-*.json file here...
    validations:
      required: true

  - type: textarea
    id: session-log
    attributes:
      label: Session Log (optional)
      description: |
        Drag and drop the JSON log file saved via Command Palette (`Ctrl+Shift+P` / `Cmd+Shift+P`) → `NVIDIA NIM: Save Session Logs`.
        Helpful for network errors (429, 503, 529), failover issues, and connection drops. API keys are automatically redacted.
      placeholder: Drag and drop the nvidia-nim-session-*.json file here...
    validations:
      required: false
