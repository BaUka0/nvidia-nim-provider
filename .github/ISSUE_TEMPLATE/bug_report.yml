name: Bug Report
description: Report an error, connection failure, model stall, or repetition loop in NVIDIA NIM Agent.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: |
        What happened, and what did you expect instead? Screenshots are welcome.
        Do not attach files here: the turn report goes in Last Turn Report below, and issues with files in this field are closed automatically.
      placeholder: Describe what went wrong...
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Active Model
      description: Which model was selected when the issue occurred?
      options:
        - "z-ai/glm-5.3-flash"
        - "deepseek-ai/deepseek-v4.1-flash"
        - "stepfun-ai/step-5-preview"
        - "minimaxai/minimax-m3.1-flash"
        - "mistralai/mistral-large-4-1t-a52b"
        - "nvidia/nemotron-3-ultra-550b-a55b"
        - "nvidia/nemotron-3.5-lightning-30b-a3b"
        - "nvidia/nemotron-3.5-super-vl-120b-a12b"
        - "meta/muse-glimmer-30b"
        - "Other / Not sure / General issue"
    validations:
      required: false

  - type: dropdown
    id: reasoning-mode
    attributes:
      label: Reasoning Mode (optional)
      description: Reasoning effort level, if applicable.
      options:
        - "Default / Unchanged"
        - "Disabled (None)"
        - "Low"
        - "Medium"
        - "High"
        - "Max"
    validations:
      required: false

  - type: upload
    id: last-turn-report
    attributes:
      label: Last Turn Report
      description: |
        Run Command Palette (`Ctrl+Shift+P` / `Cmd+Shift+P`) → `NVIDIA NIM: Save Last Turn Report` right after the failing turn, then upload the saved `nvidia-nim-turn-report-*.json` file here.
        Required. API keys are automatically redacted.
    validations:
      required: true
      accept: ".json"

  - type: upload
    id: session-log
    attributes:
      label: Session Log (optional)
      description: |
        Upload the `nvidia-nim-session-*.json` file saved via Command Palette (`Ctrl+Shift+P` / `Cmd+Shift+P`) → `NVIDIA NIM: Save Session Logs`.
        Helpful for network errors (429, 503, 529), failover issues, and connection drops. API keys are automatically redacted.
        Leave this empty if you have no session log. A turn report uploaded here is rejected and the issue is closed until it is removed.
    validations:
      required: false
      accept: ".json"
