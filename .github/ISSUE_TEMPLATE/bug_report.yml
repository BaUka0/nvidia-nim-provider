name: Bug Report
description: Report an error, connection failure, model stall, or repetition loop in NVIDIA NIM Agent.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What happened, and what was expected instead?
      placeholder: Clear summary of the issue...
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Active Model
      description: Active NVIDIA NIM model when the issue occurred.
      options:
        - "z-ai/glm-5.3"
        - "z-ai/glm-5.3-flash"
        - "moonshotai/kimi-k3"
        - "deepseek-ai/deepseek-v4-flash-0731"
        - "nvidia/nemotron-3-super-120b-a12b"
        - "nvidia/nemotron-3-ultra-550b-a55b"
        - "nvidia/nemotron-3.5-lightning-30b-a3b"
        - "meta/muse-glimmer-30b"
        - "Other (specify in description)"
    validations:
      required: true

  - type: dropdown
    id: reasoning-mode
    attributes:
      label: Reasoning Mode
      description: Selected reasoning effort level (if applicable).
      options:
        - "Default / Unchanged"
        - "Disabled (None)"
        - "Low"
        - "Medium"
        - "High"
        - "Max"
        - "N/A (model does not support reasoning)"
    validations:
      required: true

  - type: textarea
    id: session-log
    attributes:
      label: Session Log
      description: |
        Output from Command Palette (`Ctrl+Shift+P` / `Cmd+Shift+P`) → `NVIDIA NIM: Save Session Logs`.
        Attach or drag-and-drop the generated JSON file here.
        Required for HTTP 429/503/529 errors, failover failures, tool crashes, or connection drops.
      placeholder: Attach log file or paste contents here...
    validations:
      required: false

  - type: textarea
    id: last-turn-report
    attributes:
      label: Last Turn Report
      description: |
        Output from Command Palette (`Ctrl+Shift+P` / `Cmd+Shift+P`) → `NVIDIA NIM: Save Last Turn Report`.
        Attach or drag-and-drop the generated JSON file here.
        Required for repetition loops, hanging colons, truncated responses, or stalled turns.
      placeholder: Attach report file or paste contents here...
    validations:
      required: false

  - type: checkboxes
    id: privacy-check
    attributes:
      label: Privacy Check
      options:
        - label: I verified that attached logs do not contain sensitive private data (API keys are automatically redacted by the extension).
          required: true
