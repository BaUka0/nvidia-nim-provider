name: Bug Report
description: Report an error, connection failure, model stall, or repetition loop in NVIDIA NIM Agent.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: What happened, and what did you expect instead?
      placeholder: Describe what went wrong...
    validations:
      required: true

  - type: dropdown
    id: model
    attributes:
      label: Active Model
      description: Which model was selected when the issue occurred?
      options:
        - "z-ai/glm-5.3"
        - "z-ai/glm-5.3-flash"
        - "moonshotai/kimi-k3"
        - "deepseek-ai/deepseek-v4-flash-0731"
        - "nvidia/nemotron-3-super-120b-a12b"
        - "nvidia/nemotron-3-ultra-550b-a55b"
        - "nvidia/nemotron-3.5-lightning-30b-a3b"
        - "meta/muse-glimmer-30b"
        - "Other / Not sure / General issue"
    validations:
      required: false

  - type: dropdown
    id: reasoning-mode
    attributes:
      label: Reasoning Mode (optional)
      description: Reasoning effort level, if applicable.
      options:
        - "Default / Unchanged"
        - "Disabled (None)"
        - "Low"
        - "Medium"
        - "High"
        - "Max"
    validations:
      required: false

  - type: textarea
    id: session-log
    attributes:
      label: Session Log (optional)
      description: |
        Paste or attach the JSON log from Command Palette (`Ctrl+Shift+P` / `Cmd+Shift+P`) → `NVIDIA NIM: Save Session Logs`.
        Helpful for network errors (429, 503, 529), failover issues, and connection drops. API keys are automatically redacted.
      placeholder: Attach log file or paste contents here...
    validations:
      required: false

  - type: textarea
    id: last-turn-report
    attributes:
      label: Last Turn Report (optional)
      description: |
        Paste or attach the JSON report from Command Palette (`Ctrl+Shift+P` / `Cmd+Shift+P`) → `NVIDIA NIM: Save Last Turn Report`.
        Helpful for repetition loops, hanging colons, or cut-off replies. API keys are automatically redacted.
      placeholder: Attach report file or paste contents here...
    validations:
      required: false
